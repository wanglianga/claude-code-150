services:
  mysql:
    image: mysql:8.4
    container_name: mp-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: material
      MYSQL_USER: material
      MYSQL_PASSWORD: material
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 8s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: mp-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: material
      MYSQL_USER: material
      MYSQL_PASSWORD: material
      APP_JWT_SECRET: ZGVtby1zZWNyZXQta2V5LWZvci1jb25zdHJ1Y3Rpb24tbWF0ZXJpYWwtcGxhdGZvcm0tMjAyNg==
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: mp-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mp-mysql-data:
