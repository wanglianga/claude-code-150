server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: material-platform
  datasource:
    url: jdbc:h2:mem:materialdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # 生产部署请通过环境变量 APP_JWT_SECRET 覆盖
    secret: ZGVtby1zZWNyZXQta2V5LWZvci1jb25zdHJ1Y3Rpb24tbWF0ZXJpYWwtcGxhdGZvcm0tMjAyNg==
    expire-hours: 12

logging:
  level:
    com.site.material: info
